# The compose file is only for building images

name: build

services:
  dtl:
    image: metisdao/dtl:${VERSION:-dev}
    build:
      context: ..
      dockerfile: ./ops/docker/Dockerfile
      target: dtl

  relayer:
    image: metisdao/relayer:${VERSION:-dev}
    build:
      context: ..
      dockerfile: ./ops/docker/Dockerfile
      target: relayer

  batch-submitter:
    image: metisdao/batch-submitter:${VERSION:-dev}
    build:
      context: ..
      dockerfile: ./ops/docker/Dockerfile
      target: batch-submitter

  l2geth:
    image: metisdao/l2geth:${VERSION:-dev}
    build:
      context: ..
      dockerfile: ./ops/docker/Dockerfile.geth
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_DATE: ${GIT_DATE:-}

  challenger:
    image: metisdao/challenger:${VERSION:-dev}
    build:
      context: ..
      dockerfile: ./ops/docker/Dockerfile.challenger
